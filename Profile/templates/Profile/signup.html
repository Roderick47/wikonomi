{% extends "Home/form_template.html" %}

{% block title %}{% endblock %}

{% block formcontent %}
  <form method="post" action="{% url 'account_login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log In</button>
  </form>
  <p>Don't have an account? <a href="{% url 'account_signup' %}">Sign up</a></p>
{% endblock %}
