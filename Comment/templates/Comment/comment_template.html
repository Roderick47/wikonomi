{% load humanize %}
{% load static %}
{% load thumbnail %}
{% load extras %}

{% comment %} <link rel="stylesheet" href="{% static 'Comment/commentStyle.css' %}"> {% endcomment %}
    <!--comments-->
<div class="comment-thread" id="comments-container">
    {% for comment in comments %}
        <div id="comment-{{ comment.id }}">
            {% include 'Comment/comment_item.html' %}
        </div>
    {% endfor %}
</div>

{% if comments.has_next %}
    <div hx-get="{% url 'Comment:load-more' product.id %}?page={{ comments.next_page_number }}"
         hx-trigger="revealed"
         hx-swap="afterend"
         hx-target="this">
    </div>
{% endif %}

<div class="mt-4">
    {% include 'Comment/comment_form.html' %}
</div>
