<form hx-post="{% url 'Comment:update' comment.id %}" 
      hx-target="#comment-{{ comment.id }}-content" 
      hx-swap="innerHTML"
      class="edit-comment-form">
    {% csrf_token %}
    <div class="mb-2">
        <textarea name="body" class="form-control" rows="3" required maxlength="500">{{ comment.body }}</textarea>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-sm">Save</button>
        <button type="button" 
                class="btn btn-secondary btn-sm"
                hx-get="{% url 'Comment:update' comment.id %}" 
                hx-target="#comment-{{ comment.id }}-content"
                hx-swap="innerHTML">
            Cancel
        </button>
    </div>
</form>
