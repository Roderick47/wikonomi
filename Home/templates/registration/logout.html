{% extends 'Home/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="bento-card p-4 p-md-5 text-center">
                <div class="mb-4">
                    <i class="fas fa-sign-out-alt fa-4x mb-3" style="color: var(--primary-color)"></i>
                    <h2 class="h3 mb-3">You have been logged out</h2>
                    <p class="text-muted mb-4">Thank you for using WIKONOMI. You are now logged out.</p>
                </div>
                
                <div class="d-grid gap-3">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt me-2"></i>Log In Again
                    </a>
                    <a href="{% url 'Home:home' %}" class="btn btn-outline-secondary">
                        <i class="fas fa-home me-2"></i>Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
