{% extends 'Home/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="bento-card p-4 p-md-5 text-center">
                <div class="mb-4">
                    <i class="fas fa-sign-out-alt fa-4x mb-4" style="color: var(--primary-color)"></i>
                    <h2 class="h3 mb-3">Sign Out</h2>
                    <p class="text-muted mb-4">Are you sure you want to sign out?</p>
                </div>
                
                <form method="post" action="{% url 'account_logout' %}" class="d-grid gap-3">
                    {% csrf_token %}
                    {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
                    {% endif %}
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-out-alt me-2"></i>Sign Out
                    </button>
                    <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Go Back
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
