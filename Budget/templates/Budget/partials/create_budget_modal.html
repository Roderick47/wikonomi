<div class="modal-header border-0 pb-0">
    <h5 class="modal-title fw-bold" id="createBudgetModalLabel">Create New Budget</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form hx-post="{% url 'Budget:hx_save_budget' %}" hx-target="#modal-body">
    <div class="modal-body">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label fw-semibold">Title</label>
                {{ form.title }}
                {% if form.title.errors %}<div class="text-danger small">{{ form.title.errors.0 }}</div>{% endif %}
            </div>
            <div class="col-12">
                <label class="form-label fw-semibold">Description</label>
                {{ form.description }}
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Period Type</label>
                {{ form.period_type }}
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Start Date</label>
                {{ form.start_date }}
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">End Date (Optional)</label>
                {{ form.end_date }}
            </div>
            <div class="col-12">
                <label class="form-label fw-semibold">Total Target Amount (Kina)</label>
                {{ form.target_amount }}
                <div class="form-text">Your overall limit for this budget.</div>
            </div>
        </div>

        <hr class="my-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">Initial Categories</h6>
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" 
                    hx-get="{% url 'Budget:hx_add_category_row' %}" 
                    hx-target="#category-rows" 
                    hx-swap="beforeend">
                <i class="fas fa-plus me-1"></i>Add Category
            </button>
        </div>

        <div id="category-rows">
            <!-- Dynamic rows will be added here -->
             <div class="row g-2 mb-2">
                <div class="col">
                    <input type="text" name="category_name[]" class="form-control form-control-sm" placeholder="e.g. Groceries">
                </div>
                <div class="col">
                    <input type="number" name="category_amount[]" class="form-control form-control-sm" placeholder="K0.00">
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-sm btn-light text-danger" onclick="this.closest('.row').remove()"><i class="fas fa-times"></i></button>
                </div>
             </div>
        </div>
    </div>
    <div class="modal-footer border-0">
        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary rounded-pill px-4">Save Budget</button>
    </div>
</form>
