{% load humanize %}
{% for product in products %}
<a href="#" class="list-group-item list-group-item-action d-flex align-items-center py-3 px-4" 
   hx-post="{% url 'Budget:hx_add_item' budget_id %}" 
   hx-vals='{"product_id": "{{ product.id }}"}'
   hx-swap="none"
   onclick="document.getElementById('shopping-search').value = ''; document.getElementById('search-results-container').classList.add('d-none'); document.getElementById('search-overlay').classList.add('d-none');">
    <div class="me-3 position-relative">
        {% if product.FirstPhoto %}
        <img src="{{ product.FirstPhoto.photo.url }}" class="rounded shadow-sm" style="width: 50px; height: 50px; object-fit: cover; border: 2px solid #fff;">
        {% else %}
        <div class="bg-light rounded d-flex align-items-center justify-content-center border" style="width: 50px; height: 50px;">
            <i class="fas fa-image text-muted"></i>
        </div>
        {% endif %}
    </div>
    <div class="flex-grow-1 overflow-hidden">
        <div class="fw-bold text-dark text-truncate mb-0">{{ product.name }}</div>
        <div class="d-flex align-items-center gap-2">
            <span class="text-success fw-bold small">K{{ product.price|floatformat:2|intcomma }}</span>
            {% if product.business %}
            <span class="text-muted small">•</span>
            <span class="text-muted small text-truncate"><i class="fas fa-store me-1"></i>{{ product.business.name }}</span>
            {% endif %}
        </div>
    </div>
    <div class="ms-3 text-primary bg-primary bg-opacity-10 p-2 rounded-circle">
        <i class="fas fa-plus"></i>
    </div>
</a>
{% empty %}
<div class="p-4 text-center text-muted">
    <div class="mb-2"><i class="fas fa-search fa-2x opacity-25"></i></div>
    <div class="small">No products found for your search.</div>
    <button class="btn btn-sm btn-link mt-2 text-decoration-none" 
            hx-post="{% url 'Budget:hx_add_item' budget_id %}" 
            hx-vals='js:{"name": document.getElementById("shopping-search").value || document.getElementById("advanced-search-input").value}'
            hx-swap="none"
            onclick="document.getElementById('shopping-search').value = ''; document.getElementById('search-results-container').classList.add('d-none'); document.getElementById('search-overlay').classList.add('d-none');">
        Add as custom item instead?
    </button>
</div>
{% endfor %}
