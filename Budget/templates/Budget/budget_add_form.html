{% extends 'Home/form_template.html'%}

{% block title %}
  Create Your Budget
{% endblock %}

{% block links %}
  <!-- Select2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
  
  <style>
    .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__rendered {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
    }
    
    .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__choice {
      display: flex;
      align-items: center;
      background: #e9ecef;
      border: 1px solid #dee2e6;
      border-radius: 0.25rem;
      padding: 0.25rem 0.5rem;
      margin: 0;
    }
    
    .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__choice__remove {
      color: #6c757d;
      margin-right: 0.5rem;
      border: none;
      background: none;
      cursor: pointer;
    }
    
    .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__choice__display {
      font-size: 0.875rem;
    }
    
    .select2-container--bootstrap-5 .select2-selection--multiple .select2-search {
      flex-grow: 1;
      min-width: 100px;
    }
    
    .select2-container--bootstrap-5 .select2-selection--multiple .select2-search__field {
      width: 100% !important;
    }
  </style>
{% endblock %}

{% block extra_js %}
  <!-- Select2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  
  <script>
    $(document).ready(function() {
      // Initialize Select2
      $('.select2-multiple').select2({
        theme: 'bootstrap-5',
        width: '100%',
        placeholder: 'Search and select products...',
        allowClear: true,
        closeOnSelect: false,
        templateResult: formatProduct,
        templateSelection: formatProductSelection
      });
      
      // Format how products appear in the dropdown
      function formatProduct(product) {
        if (!product.id) return product.text;
        
        var $container = $(
          '<div class="d-flex align-items-center">' +
            '<div class="flex-grow-1">' + product.text + '</div>' +
          '</div>'
        );
        
        return $container;
      }
      
      // Format how selected products appear
      function formatProductSelection(product) {
        return product.text;
      }
      
      // Update the form submission to handle the selected products
      $('form').on('submit', function() {
        // Make sure all selected products are properly submitted
        $('.select2-multiple').select2('destroy');
      });
    });
  </script>
{% endblock %}
