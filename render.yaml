services:
  # Web Service
  - type: web
    name: wikonomi
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn WIKONOMI.wsgi:application --bind 0.0.0.0:$PORT
    healthCheck:
      path: /
      initialDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_SETTINGS_MODULE
        value: WIKONOMI.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,wikonomi.com,www.wikonomi.com
    autoDeploy: true
    plan: free

  # PostgreSQL Database (optional - recommended for production)
  - type: pserv
    name: wikonomi-db
    env: postgres
    plan: free
    envVars:
      - key: POSTGRES_DB
        value: wikonomi
      - key: POSTGRES_USER
        value: wikonomi_user
      - key: POSTGRES_PASSWORD
        generateValue: true
